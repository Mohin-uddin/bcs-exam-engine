# Sonar Horin: only this domain. Doko's site and default_server are not touched.
# setup.sh writes this file on every run: HTTP only until the certificate exists, then HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __NAMES__;
    #HTTPS_REDIRECT return 301 https://$host$request_uri;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
#HTTPS_BLOCK
