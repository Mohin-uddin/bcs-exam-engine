# Render Blueprint: New > Blueprint > pick this repo. Free web service in Singapore
# (closest Render region to Bangladesh). Data lives in DATABASE_URL (e.g. Neon Postgres, Singapore).
services:
  - type: web
    name: medha
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/web/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: PAYMENT_GATEWAY
        sync: false
      - key: PAYMENT_SANDBOX
        value: "true"
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: AAMARPAY_STORE_ID
        sync: false
      - key: AAMARPAY_SIGNATURE_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
